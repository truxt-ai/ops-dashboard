name: Axiom Audit on Merge

# Notifies the Axiom autopilot when a pull request is merged, so it can scan the
# merged state and open remediation PRs for any vulnerable dependencies.
#
# The webhook URL lives in the repo secret AXIOM_AUTOPILOT_WEBHOOK.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  notify-axiom:
    runs-on: ubuntu-latest
    # secrets context is NOT available in a job-level `if` — gating on it here
    # makes the whole workflow fail to evaluate (0s failure). Gate at the step.
    if: github.event.pull_request.merged == true
    steps:
      - name: Notify Axiom autopilot
        env:
          AXIOM_WEBHOOK: ${{ secrets.AXIOM_AUTOPILOT_WEBHOOK }}
        run: |
          if [ -z "$AXIOM_WEBHOOK" ]; then
            echo "AXIOM_AUTOPILOT_WEBHOOK not set — nothing to notify."
            exit 0
          fi
          curl -sS -X POST "$AXIOM_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "$(jq -c '{
              repo: .repository.full_name,
              pr_number: .pull_request.number,
              merge_commit_sha: .pull_request.merge_commit_sha,
              base_ref: .pull_request.base.ref
            }' "$GITHUB_EVENT_PATH")"
